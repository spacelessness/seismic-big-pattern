name: Public data integrity
on:
  push:
    paths: ['data/**', 'scripts/**', 'tests/**', '.github/workflows/public-data.yml']
  pull_request:
    paths: ['data/**', 'scripts/**', 'tests/**', '.github/workflows/public-data.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_public_data.py
      - run: python scripts/validate_earthquake_catalogs.py --all
